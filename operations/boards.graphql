	documents { prefix shared root } documentsRoot documentComponents { specification component } adoptsLegacyDocuments
	perspectives perspectiveNames myPermissions
	taskPrefix taskPrefixHistory
	elementCheckPolicy { blocking mandatoryFields orphans coverage } effectiveElementCheckPolicy { blocking mandatoryFields orphans coverage }
	coordinatorPrompt missingCapabilities missingCoverage { function message } coordinatorCapabilities
	events { kind message actor { ...ActorFields } eventAt }
	pause { level reason pausedBy { ...ActorFields } pausedAt }
	coordinatorSeat { session agent claimedAt }
	perAgentWipLimit priorityType
	target defaultWorkLevel defaultInputResolution
	budgetMicros softAlertPercent cycleCap noProgressRepeatsToStop
	blockingPriority completionPriority humanQueueAgeMinutes
	coordinatorStopLift effectiveCoordinatorStopLift
	deliveryPolicy { mode awaitDeclaration merge { by method atTestedHead requireDeclaration order } }
