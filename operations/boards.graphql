# The server reads a strength field sent as null as "clear it" and one left out as "leave it",
# so these are omitted when nil: a typed caller that does not set them never clears a floor.
# @genqlient(for: "AgentTaskRoleConfigInput.requiredStrength", omitempty: true)
# @genqlient(for: "AgentTaskRoleConfigInput.strengthHeadroom", omitempty: true)
# @genqlient(for: "AgentTaskRoleConfigInput.strengthCategory", omitempty: true)
# @genqlient(for: "AgentTaskRoleConfigInput.modelStrengths", omitempty: true)
mutation AgentTaskRoleConfigSetProgrammatic (
	$boardUuid: ID!, $sessionUuid: ID!, $input: AgentTaskRoleConfigInput!) {
	agentTaskRoleConfigSetProgrammatic(boardUuid: $boardUuid, sessionUuid: $sessionUuid, input: $input) {
	uuid board org name prompt orderIndex wipLimit requireDistinctAgent active requiredCapabilities
	kind necessity humanGate
} }

query AgentTaskRoleConfigsProgrammatic ($boardUuid: ID!) { agentTaskRoleConfigsProgrammatic(boardUuid: $boardUuid) {
	uuid board org name prompt orderIndex wipLimit requireDistinctAgent active requiredCapabilities
	kind necessity humanGate
	requiredStrength strengthHeadroom strengthCategory modelStrengths { model strength }
	hopBudgetMicros
	blindReview
	requiredInputs { kind specification scope minLifecycle resolution }
	producesOutputs { specification scope required }
} }

mutation AgentTaskRegisterProgrammatic ($input: AgentTaskRegisterInput!) {
	agentTaskRegisterProgrammatic(input: $input) {
	uuid org board externalRef title sourceUrl status role orderIndex
	dependsOn requireHumanReview
	hold { level kind gateRole reason heldBy { ...ActorFields } heldAt stop }
	assignment { session agent role assignedAt promptVersion }
	signOffs { role agent session assignedAt signedOffAt outcome note promptVersion reviewedBy { ...ActorFields } usage { ...HopUsageFields } overAllowanceMicros }
	returns { role agent session reason description returnedAt usage { ...HopUsageFields } overAllowanceMicros }
	parentTask childTasks sessions prUrls registeredBySession createdDate completedAt
	statusHistory { from to at trigger actor { ...ActorFields } note }
	orderSetBy { ...ActorFields } orderSetAt requiredRolesSkipped
	questionStack { askingRole askingSession askingAgent questionsRelease answeringRole askedAt }
} }

