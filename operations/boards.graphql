query AgentTaskProgrammatic ($taskUuid: ID!) { agentTaskProgrammatic(taskUuid: $taskUuid) {
	uuid org board externalRef title sourceUrl status role orderIndex
	dependsOn requireHumanReview
	hold { level kind gateRole reason heldBy { ...ActorFields } heldAt }
	assignment { session agent role assignedAt promptVersion }
	signOffs { role agent session assignedAt signedOffAt outcome note promptVersion reviewedBy { ...ActorFields } }
	returns { role agent session reason description returnedAt }
	parentTask childTasks sessions prUrls registeredBySession createdDate completedAt
	statusHistory { from to at trigger actor { ...ActorFields } }
	documents { uuid version lifecycle document { specification path round task
		findings { kind round verdict counts { passed failed skipped }
			findings { id priority status title location { path line ref } resolvedBy resolution } } } }
	openFindings { id priority status title location { path line ref } resolvedBy resolution }
	openQuestions { id priority status title location { path line ref } resolvedBy resolution }
} }

