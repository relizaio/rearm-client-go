# The board's DELIVERING tasks and their PRs' states, for 'rearm agent wait --coordinator' (task
# RD2-32): a task waits on the coordinator when the board's merge is its and a PR is not merged.
# Light on purpose: the loop reads it once per poll only while the snapshot shows a DELIVERING task.
query AgentWaitDeliveringProgrammatic ($boardUuid: ID!) {
	agentTasksProgrammatic(boardUuid: $boardUuid, status: DELIVERING) {
	key uuid status
	pullRequests { url state }
} }

# The whole board in one read: what everyone is doing, what waits on what, and which questions
# are outstanding. An agent that needs N calls to learn this does not make them.
query AgentBoardSnapshotProgrammatic($boardUuid: ID!) { agentBoardSnapshotProgrammatic(boardUuid: $boardUuid) {
	board { uuid name status }
	tasks {
		task { key number uuid externalRef title description status role roleUuid workLevel effectiveWorkLevel orderIndex hold { level kind } group { key } tags { key } waitingOnGroups }
		holder { ...ActorFields }
		heldSince
		dependsOn { task externalRef title status }
		latestDocuments { uuid version lifecycle document { specification path round } }
		waitingOn { askingRole askingSession askingAgent questionsRelease answeringRole askedAt }
		spentMicros
		budgetMicros
	}
} }

# Where a new document of a type would go on a board, every placeholder filled by the server:
# what rearm agent doc publish uses when it is not given a file.
query AgentDocumentPath ($boardUuid: ID!, $specification: SpecificationType!, $task: ID, $component: ID) {
	agentBoardProgrammatic(boardUuid: $boardUuid) {
		uuid
		documentPath(specification: $specification, task: $task, component: $component)
	}
}

# Task groups and tags (task-groups-and-tags.md §2-§3, task RD2-29).

# A board's groups in display order, with what their tasks spent (a read of the board's usage).
query AgentBoardGroupsProgrammatic ($boardUuid: ID!) { agentBoardProgrammatic(boardUuid: $boardUuid) {
	uuid
	groups { uuid key name description order dependsOn defaultWorkLevel status createdAt progress { total done open complete } spentMicros }
} }

# The coordinator seat creates or edits a group by key; status CLOSED closes it.
mutation AgentBoardGroupSetProgrammatic ($boardUuid: ID!, $sessionUuid: ID!, $group: TaskGroupInput!) {
	agentBoardGroupSetProgrammatic(boardUuid: $boardUuid, sessionUuid: $sessionUuid, group: $group) {
	uuid key name description order dependsOn defaultWorkLevel status createdAt progress { total done open complete }
} }

# The coordinator seat moves a task into a group by key, or out of every group (group omitted is null).
mutation AgentTaskSetGroupProgrammatic ($taskUuid: ID!, $sessionUuid: ID!, $group: String) {
	agentTaskSetGroupProgrammatic(taskUuid: $taskUuid, sessionUuid: $sessionUuid, group: $group) {
	key uuid status group { uuid key name } waitingOnGroups
} }

# The coordinator seat replaces a task's tags.
mutation AgentTaskSetTagsProgrammatic ($taskUuid: ID!, $sessionUuid: ID!, $tags: [TagRecordInput!]!) {
	agentTaskSetTagsProgrammatic(taskUuid: $taskUuid, sessionUuid: $sessionUuid, tags: $tags) {
	key uuid tags { key value removable }
} }

# Who works the board (task RD3-5): every session that worked or polled it, with its state, last poll and
# offer, completed tasks, spend and cache share in the window, and the staleness rules that name it.
query AgentBoardAgentsProgrammatic ($boardUuid: ID!, $from: DateTime, $to: DateTime) {
	agentBoardProgrammatic(boardUuid: $boardUuid) {
		uuid name
		agents(from: $from, to: $to) {
			session agent agentName roles lastPollAt lastOfferAt lastActivityAt tasksCompleted costMicros cacheShare
			state { kind taskUuid taskKey since closedBy { ...ActorFields } }
			tokens { inputTokens outputTokens cacheReadTokens cacheWriteTokens requests turns reports }
			stale { rule message }
		}
	}
}

# The board's spend in a window broken down so the parts add up to the total (task RD2-8): by role
# (closed and open hops), by session, the coordinator seat's own rows and what no hop owns.
query AgentBoardSpendBreakdownProgrammatic ($boardUuid: ID!, $from: DateTime, $to: DateTime) {
	agentBoardProgrammatic(boardUuid: $boardUuid) {
		uuid
		spendBreakdown(from: $from, to: $to) {
			totalMicros costComplete coordinatorEstimateMicros unattributedMicros from to
			byRole { role costMicros closedHops openHops tokens { inputTokens outputTokens cacheReadTokens cacheWriteTokens requests turns reports } }
			bySession { session agent role costMicros tokens { inputTokens outputTokens cacheReadTokens cacheWriteTokens requests turns reports } }
		}
	}
}
