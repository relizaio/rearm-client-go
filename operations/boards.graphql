# The whole board in one read: what everyone is doing, what waits on what, and which questions
# are outstanding. An agent that needs N calls to learn this does not make them.
query AgentBoardSnapshotProgrammatic($boardUuid: ID!) { agentBoardSnapshotProgrammatic(boardUuid: $boardUuid) {
	board { uuid name status }
	tasks {
		task { uuid externalRef title status role roleUuid level orderIndex }
		holder { ...ActorFields }
		heldSince
		dependsOn { task externalRef title status }
		latestDocuments { uuid version lifecycle document { specification path round } }
		waitingOn { askingRole askingSession askingAgent questionsRelease answeringRole askedAt }
		spentMicros
		budgetMicros
	}
} }

# Where a new document of a type would go on a board, every placeholder filled by the server:
# what rearm agent doc publish uses when it is not given a file.
query AgentDocumentPath ($boardUuid: ID!, $specification: SpecificationType!, $task: ID, $component: ID) {
	agentBoardProgrammatic(boardUuid: $boardUuid) {
		uuid
		documentPath(specification: $specification, task: $task, component: $component)
	}
}
