query AgentTaskProgrammatic ($taskUuid: ID!) { agentTaskProgrammatic(taskUuid: $taskUuid) {
	key number uuid org board externalRef title description sourceUrl status role orderIndex workLevel effectiveWorkLevel workLevelSetBy { ...ActorFields } workLevelSetAt group { uuid key name } tags { key value removable } waitingOnGroups
	kind investigation { commissionedBy { role roleUuid session task by { ...ActorFields } } deliverable role roleUuid review reviewUuid deadline returnTo report completedAt }
	reportsReturned { investigation investigationKey report session role at reoffered cancelled note }
	requiredInputs { kind specification scope minLifecycle resolution release }
	dependsOn requireHumanReview
	hold { level kind gateRole reason heldBy { ...ActorFields } heldAt stop }
	assignment { session agent role assignedAt promptVersion resolvedInputs { kind specification release version lifecycle } }
	signOffs { role agent session assignedAt signedOffAt outcome note promptVersion reviewedBy { ...ActorFields } usage { ...HopUsageFields } overAllowanceMicros reviewedInputs { release specification round promotedTo } refusedPromotions { release specification round reason } }
	returns { role agent session reason description returnedAt usage { ...HopUsageFields } overAllowanceMicros }
	unassignments { role session agent assignedAt unassignedAt unassignedBy { ...ActorFields } reason usage { ...HopUsageFields } }
	parentTask childTasks sessions prUrls registeredBySession createdDate completedAt
	pullRequests { url state targetBranch mergedDate baseMovedBy registered head
		declaration { unit commit outcome by { ...ActorFields } at note supersededBy } }
	testedHeads { pr head }
	deliveries { unit commit outcome by { ...ActorFields } at note supersededBy }
	reopenedAt reopenCount reopens { role roleUuid at by { ...ActorFields } reason }
	statusHistory { from to at trigger actor { ...ActorFields } note }
	orderSetBy { ...ActorFields } orderSetAt requiredRolesSkipped updatedAt
	budgetMicros coordinatorEstimateMicros spentMicros
	questionStack { askingRole askingSession askingAgent questionsRelease answeringRole askedAt }
	documents { uuid version lifecycle document { specification path round task advisory publishedByRole
		reviewItems { kind round verdict counts { passed failed skipped } tested { pr head }
			reviewItems { id priority status title location { path line ref element } resolvedBy resolution correction } } } }
	openReviewItems { id priority status title location { path line ref element } resolvedBy resolution correction }
	openQuestions { id priority status title location { path line ref element } resolvedBy resolution }
} }

# A named set of tasks in one read, in the order given (task cc14f4cb): at most 100; unknown uuids,
# and another organization's tasks, are absent. For a board's tasks by status, AgentTasksProgrammatic.
# One task by its key, e.g. RD-42 (task 3d1f9dd7): the CLI resolves a key argument through this
# before a call that takes a task uuid. Null when no task has the key.
query AgentTaskByKeyProgrammatic ($key: String!) { agentTaskByKeyProgrammatic(key: $key) { uuid key board } }

