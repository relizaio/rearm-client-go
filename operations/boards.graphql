# Agent task boards -- the operations `rearm agent board` / `rearm agent task` send.
# Hub-and-spoke distribution: the coordinator holds a singleton session-bound seat,
# authorizes and orders tasks, and every sign-off or return routes back to it.

# Every actor selection goes through this fragment. genqlient still generates one struct
# per selection set either way -- the fragment does not collapse those -- but each of them
# then EMBEDS a single shared ActorFields, so the CLI can format any actor with one helper
# instead of eleven copies that share no type. That is the whole reason it is here.
fragment ActorFields on AgentActor { kind uuid name }

query AgentBoardsProgrammatic { agentBoardsProgrammatic {
	uuid org name description status sources
	documentsRepo { uuid uri } documentPaths
	coordinatorPrompt missingCapabilities
	events { kind message actor { ...ActorFields } eventAt }
	lock { level reason lockedBy { ...ActorFields } lockedAt }
	coordinatorSeat { session agent claimedAt }
	perAgentWipLimit priorityType createdDate
} }

query AgentBoardProgrammatic ($boardUuid: ID!) { agentBoardProgrammatic(boardUuid: $boardUuid) {
