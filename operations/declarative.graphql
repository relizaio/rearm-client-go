# Declarative configuration: Catalog, Branches, board and role-presets slices.

fragment ChangeFields on DeclarativeChange {
  kind
  name
  action
  fields
  message
  warnings
}

fragment ApplyResultFields on DeclarativeApplyResult {
  kind
  dryRun
  specHash
  created
  updated
  unchanged
  archived
  errors
  changes {
    ...ChangeFields
  }
}

fragment ProvenanceFields on DeclarativeProvenance {
  specHash
  appliedAt
  source {
    repo
    path
    commit
  }
}

mutation ApplyCatalog($spec: CatalogSpecInput!, $dryRun: Boolean, $source: DeclarativeSourceInput) {
  applyCatalogProgrammatic(spec: $spec, dryRun: $dryRun, source: $source) {
    ...ApplyResultFields
  }
}

mutation ApplyBranches($spec: BranchesSpecInput!, $dryRun: Boolean, $source: DeclarativeSourceInput) {
  applyBranchesProgrammatic(spec: $spec, dryRun: $dryRun, source: $source) {
    ...ApplyResultFields
  }
}

query ExportCatalog($components: [String!]) {
  exportCatalogProgrammatic(components: $components) {
    kind
    version
    authoritative
    components {
      name
      type
      kind
      versionSchema
      marketingVersionSchema
      versionType
      featureBranchVersioning
      vcsUri
      vcsType
      repoPath
      nature
      deviceClass
      branchSuffixMode
      identifiers {
        idType
        idValue
      }
      provenance {
        ...ProvenanceFields
      }
    }
  }
}

query ExportBranches($component: String!) {
  exportBranchesProgrammatic(component: $component) {
    kind
    version
    component
    authoritative
    branches {
      name
      type
      versionSchema
      marketingVersionSchema
      vcsBranch
      autoIntegrate
      findingAnalyticsParticipation
      dependencies {
        component
        branch
        release
        status
        isFollowVersion
      }
      dependencyPatterns {
        pattern
        targetBranchName
        defaultStatus
        fallbackToBase
      }
      provenance {
        ...ProvenanceFields
      }
    }
  }
}

mutation ApplyBoard($spec: BoardSpecInput!, $dryRun: Boolean, $source: DeclarativeSourceInput) {
  applyBoardProgrammatic(spec: $spec, dryRun: $dryRun, source: $source) {
    ...ApplyResultFields
  }
}

mutation ApplyRolePresets($spec: RolePresetsSpecInput!, $dryRun: Boolean, $source: DeclarativeSourceInput) {
  applyRolePresetsProgrammatic(spec: $spec, dryRun: $dryRun, source: $source) {
    ...ApplyResultFields
  }
}

fragment BoardRoleSpecFields on BoardRoleSpec {
  name
  prompt
  orderIndex
  wipLimit
  requireDistinctAgent
  active
  kind
  necessity
  humanGate
  requiredCapabilities
  requiredInputs { kind specification scope component minLifecycle resolution }
  producesOutputs { specification scope required }
  hopBudgetMicros
  blindReview
  strength {
    requiredStrength
    strengthHeadroom
    strengthCategory
    modelStrengths { model strength }
  }
}

query ExportBoard($board: String!) {
  exportBoardProgrammatic(board: $board) {
    kind
    version
    name
    description
    target
    defaultTaskLevel
    defaultInputResolution
    priorityType
    perAgentWipLimit
    sources
    documentsRepo
    documentPaths
    elementFamilies
    checks { blocking mandatoryFields orphans coverage }
    coordinatorPrompt
    coordinatorCapabilities
    settings {
      budgetMicros
      softAlertPercent
      cycleCap
      noProgressRepeatsToStop
      blockingPriority
      completionPriority
    }
    roles { ...BoardRoleSpecFields }
  }
}

query ExportRolePresets {
  agentRolePresetsSpecProgrammatic {
    kind
    version
    authoritative
    presets { ...BoardRoleSpecFields }
  }
}

mutation ArchiveBoard($name: String!) {
  archiveBoardProgrammatic(name: $name) {
    uuid
    name
    status
  }
}
