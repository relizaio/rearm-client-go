schema:
  - schema/programmatic.graphqls
operations:
  - operations/*.graphql
generated: generated.go
package: rearm
use_struct_references: true
optional: pointer
bindings:
  ID:
    type: string
  DateTime:
    type: string
  Long:
    type: int64
  JSON:
    type: encoding/json.RawMessage
  Object:
    type: encoding/json.RawMessage
  Upload:
    type: string
  # Board and presets files go over the wire as the maps they were read into: a field
  # declared null clears it and one left out does not (declarative-boards D15), and a
  # typed struct cannot keep that difference.
  BoardSpecInput:
    type: map[string]interface{}
  RolePresetsSpecInput:
    type: map[string]interface{}
